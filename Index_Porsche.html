<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Porsche | Business Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --porsche-red: #d5001c;
            --porsche-black: #191f22;
            --porsche-dark: #000000;
            --porsche-gray: #f5f5f5;
            --porsche-border: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #ffffff;
            color: var(--porsche-black);
            overflow: hidden;
        }

        /* Sidebar Elegante */
        .sidebar {
            width: 320px;
            background-color: var(--porsche-gray);
            border-right: 1px solid var(--porsche-border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .brand {
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: var(--porsche-dark);
            border-bottom: 2px solid var(--porsche-red);
            padding-bottom: 10px;
            display: inline-block;
        }

        .filter-group {
            margin-bottom: 25px;
        }

        .filter-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #555;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 0;
            background-color: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--porsche-red);
        }

        .price-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 300;
            margin: 0;
            color: var(--porsche-dark);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .chart-card {
            background: #fff;
            border: 1px solid var(--porsche-border);
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .chart-card.full-width {
            grid-column: span 2;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--porsche-dark);
        }

        canvas {
            max-height: 350px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ccc; }
        ::-webkit-scrollbar-thumb:hover { background: var(--porsche-red); }
    </style>
</head>
<body>

    <!-- Filtros -->
    <div class="sidebar">
        <div class="brand">Porsche</div>
        
        <div class="filter-group">
            <label for="modelFilter">Modelo</label>
            <select id="modelFilter" onchange="updateDashboard()">
                <option value="All">Todos os Modelos</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="stateFilter">Estado</label>
            <select id="stateFilter" onchange="updateDashboard()">
                <option value="All">Todos os Estados</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="payMethodFilter">Método de Pagamento</label>
            <select id="payMethodFilter" onchange="updateDashboard()">
                <option value="All">Todos os Métodos</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="priceFilter">Preço Máximo de Venda</label>
            <input type="range" id="priceFilter" min="50000" max="300000" step="5000" value="300000" oninput="updatePriceLabel(); updateDashboard()">
            <div class="price-labels">
                <span>$50,000</span>
                <span id="priceValueLabel">$300,000</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>Sales Intelligence Dashboard</h1>
        </div>

        <div class="dashboard-grid">
            <!-- Gráfico 1: Modelos por Estado -->
            <div class="chart-card full-width">
                <div class="chart-title">Principais Modelos Vendidos por Estado</div>
                <canvas id="modelsByStateChart"></canvas>
            </div>

            <!-- Gráfico 2: Métodos de Pagamento -->
            <div class="chart-card">
                <div class="chart-title">Métodos de Pagamento por Estado</div>
                <canvas id="payMethodChart"></canvas>
            </div>

            <!-- Gráfico 3: Valor Total por Veículo -->
            <div class="chart-card">
                <div class="chart-title">Receita Total por Modelo ($)</div>
                <canvas id="revenueByModelChart"></canvas>
            </div>
        </div>
    </div>

        ];

        function populateSelect(id, key) {
            const select = document.getElementById(id);
            const uniqueValues = [...new Set(rawData.map(item => item[key]))].sort();
            uniqueValues.forEach(val => {
                const option = document.createElement("option");
                option.value = val;
                option.text = val;
                select.appendChild(option);
            });
        }

        function initFilters() {
            populateSelect("modelFilter", "PorscheModelSanitized");
            populateSelect("stateFilter", "StateSanitized");
            populateSelect("payMethodFilter", "PayMethodSanitized");
        }

        function updatePriceLabel() {
            const price = document.getElementById("priceFilter").value;
            document.getElementById("priceValueLabel").textContent = "$" + parseInt(price).toLocaleString();
        }

        function getFilteredData() {
            const mFilter = document.getElementById("modelFilter").value;
            const sFilter = document.getElementById("stateFilter").value;
            const pFilter = document.getElementById("payMethodFilter").value;
            const maxPrice = parseFloat(document.getElementById("priceFilter").value);

            return rawData.filter(item => {
                return (mFilter === "All" || item.PorscheModelSanitized === mFilter) &&
                       (sFilter === "All" || item.StateSanitized === sFilter) &&
                       (pFilter === "All" || item.PayMethodSanitized === pFilter) &&
                       (item.SalesPriceSanitized <= maxPrice);
            });
        }

        function renderModelsByStateChart(data) {
            const ctx = document.getElementById('modelsByStateChart').getContext('2d');
            if (chartModelsByState) chartModelsByState.destroy();

            // Aggregate: Count models per state
            const stateModelCount = {};
            data.forEach(d => {
                if(!stateModelCount[d.StateSanitized]) stateModelCount[d.StateSanitized] = {};
                stateModelCount[d.StateSanitized][d.PorscheModelSanitized] = (stateModelCount[d.StateSanitized][d.PorscheModelSanitized] || 0) + 1;
            });

            const states = Object.keys(stateModelCount).sort();
            const allModels = [...new Set(data.map(d => d.PorscheModelSanitized))];

            const datasets = allModels.map((model, i) => {
                return {
                    label: model,
                    data: states.map(state => stateModelCount[state][model] || 0),
                    backgroundColor: colorPalette[i % colorPalette.length],
                };
            });

            chartModelsByState = new Chart(ctx, {
                type: 'bar',
                data: { labels: states, datasets: datasets },
                options: {
                    responsive: true,
                    scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: {stepSize: 1} } },
                    plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: {family: "'Segoe UI', sans-serif"} } } }
                }
            });
        }

        function renderPayMethodChart(data) {
            const ctx = document.getElementById('payMethodChart').getContext('2d');
            if (chartPayMethod) chartPayMethod.destroy();

            const payMethodCount = {};
            data.forEach(d => {
                payMethodCount[d.PayMethodSanitized] = (payMethodCount[d.PayMethodSanitized] || 0) + 1;
            });

            const methods = Object.keys(payMethodCount);
            const counts = Object.values(payMethodCount);

            chartPayMethod = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: methods,
                    datasets: [{
                        data: counts,
                        backgroundColor: colorPalette.slice(0, methods.length),
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    cutout: '65%',
                    plugins: {
                        legend: { position: 'bottom', labels: { font: {family: "'Segoe UI', sans-serif"} } }
                    }
                }
            });
        }

        function renderRevenueChart(data) {
            const ctx = document.getElementById('revenueByModelChart').getContext('2d');
            if (chartRevenue) chartRevenue.destroy();

            const revenueByModel = {};
            data.forEach(d => {
                revenueByModel[d.PorscheModelSanitized] = (revenueByModel[d.PorscheModelSanitized] || 0) + d.SalesPriceSanitized;
            });

            // Sort by revenue
            const sortedModels = Object.keys(revenueByModel).sort((a, b) => revenueByModel[b] - revenueByModel[a]).slice(0, 10);
            const revenues = sortedModels.map(m => revenueByModel[m]);

            chartRevenue = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sortedModels,
                    datasets: [{
                        label: 'Receita Total ($)',
                        data: revenues,
                        backgroundColor: '#191f22',
                        hoverBackgroundColor: '#d5001c'
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    scales: { x: { beginAtZero: true } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateDashboard() {
            const filteredData = getFilteredData();
            renderModelsByStateChart(filteredData);
            renderPayMethodChart(filteredData);
            renderRevenueChart(filteredData);
        }

        // Init
        initFilters();
        updateDashboard();
    </script>
</body>
</html>
